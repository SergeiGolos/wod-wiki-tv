plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.example.gymtvapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.gymtvapp"
        minSdk 21 // Minimum for Android TV
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10' // Aligned with Kotlin 1.9.10 as per PR feedback
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'

    // Jetpack Compose for TV
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.0-beta02'
    implementation 'androidx.tv:tv-foundation:1.0.0-alpha10'
    implementation 'androidx.tv:tv-material:1.0.0-alpha10'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.0-beta02'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.6.0-beta02'


    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ViewModel and LiveData/StateFlow
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2' // Optional
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'


    // Ktor for WebSockets (Server)
    // Ktor Server: The Android TV app acts as a WebSocket server for mobile clients.
    // This has implications for resource usage and network configuration on the TV device.
    // This architectural choice is based on the project README.
    implementation 'io.ktor:ktor-server-core:2.3.6'
    implementation 'io.ktor:ktor-server-cio:2.3.6' // Using CIO engine for Ktor server
    implementation 'io.ktor:ktor-server-websockets:2.3.6'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:2.3.6' // For JSON serialization with WebSockets

    // QR Code Generation (ZXing)
    implementation 'com.google.zxing:core:3.5.2'

    // Hilt for Dependency Injection
    implementation 'com.google.dagger:hilt-android:2.48.1'
    kapt 'com.google.dagger:hilt-compiler:2.48.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.6.0-beta02"
}

// Allow references to generated code
kapt {
    correctErrorTypes true
}
